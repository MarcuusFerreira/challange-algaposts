version: '3.9'

services:
  alga-post-rabbitmq:
    image: rabbitmq:3-management
    restart: no
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    volumes:
      - algapost-rabbitmq:/var/lib/rabbitmq/
      - ./config/rabbitmq/enabled_plugins/:/etc/rabbitmq/enabled_plugins

volumes:
  algapost-rabbitmq: